# ============================================================
# nginx 配置片段：把本游戏发布到 http://<服务器>/manosaba/
# ------------------------------------------------------------
# 用法：把 location 段放进对应 server { } 里，然后
#   sudo nginx -t && sudo systemctl reload nginx
#
# 前提：deploy.sh（或 git clone）已把文件放到 /var/www/manosaba
# 若换过 WWW_ROOT，下面的 root 要同步修改。
#
# 游戏全部使用相对路径引用资源，所以放子目录可以直接工作，
# 不需要 rewrite，也不需要 <base> 标签。
# ============================================================

location /manosaba/ {
    root /var/www;                                  # ← 与 WWW_ROOT 保持一致
    index index.html;
    try_files $uri $uri/ /manosaba/index.html;

    sendfile on;
    tcp_nopush on;

    # HTML 不缓存，保证更新后立刻生效
    location ~* ^/manosaba/.*\.html$ {
        root /var/www;
        expires off;
        add_header Cache-Control "no-cache";
    }

    # 静态资源 7 天缓存（音乐可达 30 天）
    location ~* ^/manosaba/.*\.(webp|png|jpe?g|gif|svg|woff2?|ttf|otf|js|css)$ {
        root /var/www;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location ~* ^/manosaba/.*\.(mp3|ogg|wav|m4a)$ {
        root /var/www;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # 纯静态站点：不需要任何后端 / WebSocket 转发
    # （联机走 wss://broker.emqx.io:8084，由浏览器直连公共 broker）
}

# 可选：访问站点根路径时跳转到游戏
# location = / {
#     return 302 /manosaba/;
# }
