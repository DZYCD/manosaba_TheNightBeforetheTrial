# ============================================================
# nginx 配置片段：把本游戏发布到 http://<服务器>/manosaba/
# ------------------------------------------------------------
# 用法：把 location 段放进对应 server { } 里，然后
#   nginx -t && systemctl reload nginx
#
# 前提：deploy.sh 已把文件放到 /var/www/manosaba
# （若换过 WWW_ROOT，下面的 root 要跟着改）
# ============================================================

# 游戏全部使用相对路径引用资源，所以放子目录可以直接工作。
location /manosaba/ {
    root /var/www;
    index index.html;
    try_files $uri $uri/ /manosaba/index.html;

    # 大文件（音乐/立绘）走 sendfile + 长缓存
    sendfile on;
    tcp_nopush on;

    # 资源带版本语义弱，用较长缓存；html 不缓存以便更新立即生效
    location ~* ^/manosaba/.*\.(webp|png|jpg|jpeg|gif|svg|woff2?|ttf|mp3|ogg|wav)$ {
        root /var/www;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location ~* ^/manosaba/.*\.(js|css)$ {
        root /var/www;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~* ^/manosaba/.*\.html$ {
        root /var/www;
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # WebSocket 不需要：联机走 wss://broker.emqx.io:8084（外网公共 broker），
    # 页面本身是纯静态。这里不转发任何后端。
}

# 可选：访问根路径时跳转到游戏
# location = / {
#     return 302 /manosaba/;
# }
